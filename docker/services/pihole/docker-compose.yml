services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      - TZ=${TIMEZONE:-Asia/Kolkata}
      - FTLCONF_LOCAL_IPV4=${HOST_IP:-0.0.0.0}
    volumes:
      - ${STORAGE_ROOT}/pihole/etc-pihole:/etc/pihole
      - ${STORAGE_ROOT}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
